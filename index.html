<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskMaster · Gestor de tareas</title>

  <!-- Tailwind CSS desde CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>

  <style>
    /* Pequeños extras de CSS propios */
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .pop-in { animation: pop-in 0.22s ease-out both; }

    /* Táctil: evita el retardo y el zoom por doble toque */
    button, input, select { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

    /* Botones de acción: siempre visibles, salvo con ratón (hover real) */
    .acciones { opacity: 1; }
    @media (hover: hover) and (pointer: fine) {
      .acciones { opacity: 0; transition: opacity 0.15s; }
      li:hover .acciones, li:focus-within .acciones { opacity: 1; }
    }
    .bg-grid {
      background-image:
        radial-gradient(circle at 1px 1px, rgba(99,102,241,0.15) 1px, transparent 0);
      background-size: 24px 24px;
    }
  </style>
</head>

<body class="min-h-screen bg-slate-50 text-slate-800 transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100 bg-grid">

  <div class="mx-auto flex min-h-screen max-w-3xl flex-col px-4 py-8 sm:px-6 sm:py-12">

    <!-- Cabecera -->
    <header class="mb-8 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 text-white shadow-lg shadow-indigo-500/30">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <div>
          <h1 class="text-2xl font-extrabold tracking-tight sm:text-3xl">TaskMaster</h1>
          <p id="fecha" class="text-sm capitalize text-slate-500 dark:text-slate-400"></p>
        </div>
      </div>

      <button id="btn-tema" type="button" aria-label="Cambiar tema"
        class="rounded-xl border border-slate-200 bg-white p-2.5 text-slate-600 shadow-sm transition hover:scale-105 hover:text-indigo-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:text-amber-300">
        <svg id="icono-sol" xmlns="http://www.w3.org/2000/svg" class="hidden h-5 w-5 dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <svg id="icono-luna" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>
    </header>

    <!-- Tarjetas de estadísticas -->
    <section class="mb-6 grid grid-cols-3 gap-3 sm:gap-4">
      <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
        <p class="text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400">Total</p>
        <p id="stat-total" class="mt-1 text-2xl font-bold sm:text-3xl">0</p>
      </div>
      <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
        <p class="text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400">Pendientes</p>
        <p id="stat-pendientes" class="mt-1 text-2xl font-bold text-amber-500 sm:text-3xl">0</p>
      </div>
      <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
        <p class="text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400">Hechas</p>
        <p id="stat-hechas" class="mt-1 text-2xl font-bold text-emerald-500 sm:text-3xl">0</p>
      </div>
    </section>

    <!-- Barra de progreso -->
    <section class="mb-6">
      <div class="mb-2 flex items-center justify-between text-sm">
        <span class="font-medium text-slate-600 dark:text-slate-300">Progreso</span>
        <span id="progreso-texto" class="font-semibold text-indigo-600 dark:text-indigo-400">0%</span>
      </div>
      <div class="h-3 w-full overflow-hidden rounded-full bg-slate-200 dark:bg-slate-800">
        <div id="progreso-barra" class="h-full w-0 rounded-full bg-gradient-to-r from-indigo-500 to-fuchsia-500 transition-all duration-500"></div>
      </div>
    </section>

    <!-- Formulario nueva tarea -->
    <form id="form-tarea" class="mb-6 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-5" autocomplete="off">
      <label for="input-titulo" class="mb-2 block text-sm font-semibold">Nueva tarea</label>
      <div class="flex flex-col gap-3 sm:flex-row">
        <input id="input-titulo" type="text" maxlength="120" placeholder="¿Qué tienes que hacer?"
          class="flex-1 rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-base outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 dark:border-slate-700 dark:bg-slate-800 dark:placeholder-slate-500 sm:py-2.5 sm:text-sm" />
        <select id="select-prioridad" aria-label="Prioridad"
          class="rounded-xl border border-slate-300 bg-slate-50 px-3 py-3 text-base outline-none sm:py-2.5 sm:text-sm transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 dark:border-slate-700 dark:bg-slate-800">
          <option value="alta">🔴 Alta</option>
          <option value="media" selected>🟡 Media</option>
          <option value="baja">🟢 Baja</option>
        </select>
        <button type="submit"
          class="rounded-xl bg-gradient-to-r from-indigo-500 to-fuchsia-500 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-500/30 transition hover:brightness-110 active:scale-95">
          Añadir
        </button>
      </div>
      <p id="error-form" class="mt-2 hidden text-sm text-rose-500">Escribe un título para la tarea.</p>
    </form>

    <!-- Filtros y búsqueda -->
    <section class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div id="filtros" class="flex w-full rounded-xl border border-slate-200 bg-white p-1 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:inline-flex sm:w-auto">
        <button data-filtro="todas" class="filtro rounded-lg px-4 py-1.5 text-sm font-medium transition">Todas</button>
        <button data-filtro="pendientes" class="filtro rounded-lg px-4 py-1.5 text-sm font-medium transition">Pendientes</button>
        <button data-filtro="hechas" class="filtro rounded-lg px-4 py-1.5 text-sm font-medium transition">Hechas</button>
      </div>
      <input id="input-buscar" type="search" placeholder="Buscar…"
        class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-base outline-none sm:py-2 sm:text-sm transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 dark:border-slate-800 dark:bg-slate-900 sm:w-56" />
    </section>

    <!-- Lista de tareas -->
    <main class="flex-1">
      <ul id="lista" class="space-y-3"></ul>

      <div id="vacio" class="hidden rounded-2xl border border-dashed border-slate-300 py-14 text-center dark:border-slate-700">
        <div class="mb-3 text-5xl">📝</div>
        <p class="font-semibold">No hay tareas que mostrar</p>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Añade una nueva o cambia el filtro.</p>
      </div>
    </main>

    <!-- Pie -->
    <footer class="mt-8 flex items-center justify-between text-sm text-slate-500 dark:text-slate-400">
      <span id="pie-contador">0 tareas</span>
      <button id="btn-limpiar" type="button" class="-mr-2 px-2 py-2 font-medium text-rose-500 transition hover:text-rose-600 hover:underline">
        Borrar completadas
      </button>
    </footer>
  </div>

  <script>
    (() => {
      'use strict';

      const CLAVE_TAREAS = 'taskmaster.tareas';
      const CLAVE_TEMA = 'taskmaster.tema';

      // ---------- Estado ----------
      let tareas = cargar(CLAVE_TAREAS, [
        { id: uid(), titulo: 'Bienvenido a TaskMaster 👋', prioridad: 'media', hecha: false },
        { id: uid(), titulo: 'Marca esta tarea como hecha', prioridad: 'baja', hecha: false },
        { id: uid(), titulo: 'Prueba el modo oscuro (arriba a la derecha)', prioridad: 'alta', hecha: true }
      ]);
      let filtro = 'todas';
      let busqueda = '';
      let editandoId = null;

      // ---------- Elementos ----------
      const $ = (id) => document.getElementById(id);
      const lista = $('lista'), vacio = $('vacio');
      const form = $('form-tarea'), inputTitulo = $('input-titulo');
      const selectPrioridad = $('select-prioridad'), errorForm = $('error-form');

      // ---------- Utilidades ----------
      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      }
      function cargar(clave, defecto) {
        try {
          const raw = localStorage.getItem(clave);
          return raw ? JSON.parse(raw) : defecto;
        } catch (e) { return defecto; }
      }
      function guardar(clave, valor) {
        try { localStorage.setItem(clave, JSON.stringify(valor)); } catch (e) { /* sin almacenamiento */ }
      }

      const ESTILOS_PRIORIDAD = {
        alta:  { etiqueta: 'Alta',  clases: 'bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-300' },
        media: { etiqueta: 'Media', clases: 'bg-amber-100 text-amber-700 dark:bg-amber-500/15 dark:text-amber-300' },
        baja:  { etiqueta: 'Baja',  clases: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300' }
      };

      // ---------- Tema ----------
      function aplicarTema(oscuro) {
        document.documentElement.classList.toggle('dark', oscuro);
        guardar(CLAVE_TEMA, oscuro ? 'oscuro' : 'claro');
      }
      const temaGuardado = cargar(CLAVE_TEMA, null);
      aplicarTema(temaGuardado
        ? temaGuardado === 'oscuro'
        : window.matchMedia('(prefers-color-scheme: dark)').matches);

      $('btn-tema').addEventListener('click', () => {
        aplicarTema(!document.documentElement.classList.contains('dark'));
      });

      // ---------- Fecha ----------
      $('fecha').textContent = new Date().toLocaleDateString('es-ES', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });

      // ---------- Render ----------
      function tareasFiltradas() {
        return tareas.filter((t) => {
          if (filtro === 'pendientes' && t.hecha) return false;
          if (filtro === 'hechas' && !t.hecha) return false;
          if (busqueda && !t.titulo.toLowerCase().includes(busqueda)) return false;
          return true;
        });
      }

      function crearItem(t) {
        const li = document.createElement('li');
        li.className = 'pop-in group flex items-center gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm transition hover:shadow-md dark:border-slate-800 dark:bg-slate-900';

        // Casilla
        const check = document.createElement('input');
        check.type = 'checkbox';
        check.checked = t.hecha;
        check.setAttribute('aria-label', 'Marcar como hecha');
        check.className = 'h-6 w-6 shrink-0 cursor-pointer rounded-md accent-indigo-600';
        check.addEventListener('change', () => {
          t.hecha = check.checked;
          actualizar();
        });

        // Contenido
        const cuerpo = document.createElement('div');
        cuerpo.className = 'min-w-0 flex-1';

        let titulo;
        if (t.id === editandoId) {
          // Edición en línea (los prompt() no funcionan bien en móviles)
          titulo = document.createElement('input');
          titulo.type = 'text';
          titulo.value = t.titulo;
          titulo.maxLength = 120;
          titulo.setAttribute('aria-label', 'Editar título');
          titulo.className = 'w-full rounded-lg border border-indigo-400 bg-slate-50 px-3 py-2 text-base outline-none focus:ring-4 focus:ring-indigo-500/20 dark:border-indigo-500 dark:bg-slate-800 sm:text-sm';
          let cerrado = false;
          const terminar = (guardarCambio) => {
            if (cerrado) return;
            cerrado = true;
            const nuevo = titulo.value.trim();
            if (guardarCambio && nuevo) t.titulo = nuevo.slice(0, 120);
            editandoId = null;
            actualizar();
          };
          titulo.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') terminar(true);
            if (e.key === 'Escape') terminar(false);
          });
          titulo.addEventListener('blur', () => terminar(true));
          setTimeout(() => { titulo.focus(); titulo.select(); }, 0);
        } else {
          titulo = document.createElement('p');
          titulo.textContent = t.titulo; // textContent evita inyección de HTML
          titulo.className = 'break-words text-sm font-medium sm:text-base ' +
            (t.hecha ? 'text-slate-400 line-through dark:text-slate-500' : '');
        }

        const p = ESTILOS_PRIORIDAD[t.prioridad] || ESTILOS_PRIORIDAD.media;
        const badge = document.createElement('span');
        badge.textContent = p.etiqueta;
        badge.className = 'mt-1 inline-block rounded-full px-2.5 py-0.5 text-xs font-semibold ' + p.clases;

        cuerpo.append(titulo, badge);

        // Botones
        const acciones = document.createElement('div');
        acciones.className = 'acciones flex shrink-0 gap-0.5';

        const btnEditar = document.createElement('button');
        btnEditar.type = 'button';
        btnEditar.title = 'Editar';
        btnEditar.setAttribute('aria-label', 'Editar tarea');
        btnEditar.className = 'rounded-lg p-2.5 text-slate-400 transition hover:bg-indigo-50 hover:text-indigo-600 dark:hover:bg-indigo-500/10';
        btnEditar.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536M9 13l6.768-6.768a2 2 0 112.828 2.828L11.828 15.83a2 2 0 01-.9.52L7 17l.65-3.93a2 2 0 01.52-.9z"/></svg>';
        btnEditar.addEventListener('click', () => {
          editandoId = t.id;
          render();
        });

        const btnBorrar = document.createElement('button');
        btnBorrar.type = 'button';
        btnBorrar.title = 'Eliminar';
        btnBorrar.setAttribute('aria-label', 'Eliminar tarea');
        btnBorrar.className = 'rounded-lg p-2.5 text-slate-400 transition hover:bg-rose-50 hover:text-rose-600 dark:hover:bg-rose-500/10';
        btnBorrar.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>';
        btnBorrar.addEventListener('click', () => {
          tareas = tareas.filter((x) => x.id !== t.id);
          actualizar();
        });

        acciones.append(btnEditar, btnBorrar);
        li.append(check, cuerpo, acciones);
        return li;
      }

      function render() {
        // Lista
        lista.replaceChildren();
        const visibles = tareasFiltradas();
        visibles.forEach((t) => lista.appendChild(crearItem(t)));
        vacio.classList.toggle('hidden', visibles.length > 0);

        // Estadísticas
        const total = tareas.length;
        const hechas = tareas.filter((t) => t.hecha).length;
        const pendientes = total - hechas;
        const porcentaje = total ? Math.round((hechas / total) * 100) : 0;

        $('stat-total').textContent = total;
        $('stat-pendientes').textContent = pendientes;
        $('stat-hechas').textContent = hechas;
        $('progreso-texto').textContent = porcentaje + '%';
        $('progreso-barra').style.width = porcentaje + '%';
        $('pie-contador').textContent = total + (total === 1 ? ' tarea' : ' tareas');

        // Filtros activos
        document.querySelectorAll('.filtro').forEach((b) => {
          const activo = b.dataset.filtro === filtro;
          b.className = 'filtro flex-1 rounded-lg px-4 py-2 text-sm font-medium transition sm:flex-none sm:py-1.5 ' +
            (activo
              ? 'bg-indigo-600 text-white shadow'
              : 'text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800');
        });
      }

      function actualizar() {
        guardar(CLAVE_TAREAS, tareas);
        render();
      }

      // ---------- Eventos ----------
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const titulo = inputTitulo.value.trim();
        if (!titulo) {
          errorForm.classList.remove('hidden');
          inputTitulo.focus();
          return;
        }
        errorForm.classList.add('hidden');
        tareas.unshift({ id: uid(), titulo, prioridad: selectPrioridad.value, hecha: false });
        inputTitulo.value = '';
        actualizar();
      });

      inputTitulo.addEventListener('input', () => errorForm.classList.add('hidden'));

      $('filtros').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-filtro]');
        if (!btn) return;
        filtro = btn.dataset.filtro;
        render();
      });

      $('input-buscar').addEventListener('input', (e) => {
        busqueda = e.target.value.trim().toLowerCase();
        render();
      });

      // Confirmación en dos toques (confirm() no es fiable en móviles)
      const btnLimpiar = $('btn-limpiar');
      let limpiarTimer = null;
      function restablecerLimpiar() {
        clearTimeout(limpiarTimer);
        btnLimpiar.dataset.confirmar = '';
        btnLimpiar.textContent = 'Borrar completadas';
      }
      btnLimpiar.addEventListener('click', () => {
        if (!tareas.some((t) => t.hecha)) return;
        if (!btnLimpiar.dataset.confirmar) {
          btnLimpiar.dataset.confirmar = '1';
          btnLimpiar.textContent = '¿Seguro? Toca de nuevo';
          limpiarTimer = setTimeout(restablecerLimpiar, 3000);
          return;
        }
        restablecerLimpiar();
        tareas = tareas.filter((t) => !t.hecha);
        actualizar();
      });

      render();
    })();
  </script>
</body>
</html>
